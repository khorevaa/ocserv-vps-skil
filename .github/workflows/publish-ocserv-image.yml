name: Publish ocserv image

on:
  workflow_dispatch:
    inputs:
      ocserv_version:
        description: Exact ocserv version
        required: true
        type: string
      source_url:
        description: HTTPS source archive URL
        required: true
        type: string
      source_sha256:
        description: Exact 64-hex archive SHA-256
        required: true
        type: string
      signature_url:
        description: HTTPS detached signature URL
        required: true
        type: string
      signing_key_url:
        description: HTTPS signing key URL
        required: true
        type: string
      signing_key_fingerprint:
        description: Full expected signing key fingerprint
        required: true
        type: string
      base_image:
        description: Debian or Ubuntu base image with @sha256 digest
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ocserv-${{ inputs.ocserv_version }}-${{ inputs.source_sha256 }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate immutable inputs
        env:
          VERSION: ${{ inputs.ocserv_version }}
          SHA256: ${{ inputs.source_sha256 }}
          BASE_IMAGE: ${{ inputs.base_image }}
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$ ]]
          [[ "${SHA256}" =~ ^[0-9A-Fa-f]{64}$ ]]
          [[ "${BASE_IMAGE}" =~ @sha256:[0-9A-Fa-f]{64}$ ]]

      - name: Verify and prepare ocserv source
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
          SIGNATURE_URL: ${{ inputs.signature_url }}
          SIGNING_KEY_URL: ${{ inputs.signing_key_url }}
          SIGNING_KEY_FINGERPRINT: ${{ inputs.signing_key_fingerprint }}
        run: |
          docker/prepare-context.sh \
            "${SOURCE_URL}" \
            "${SOURCE_SHA256}" \
            "${SIGNATURE_URL}" \
            "${SIGNING_KEY_URL}" \
            "${SIGNING_KEY_FINGERPRINT}" \
            docker/context

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Create BuildKit builder
        run: |
          set -euo pipefail
          docker buildx create --driver docker-container --name ocserv-builder --use
          docker buildx inspect --bootstrap

      - name: Build and push version tag
        id: build
        env:
          VERSION: ${{ inputs.ocserv_version }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
          BASE_IMAGE: ${{ inputs.base_image }}
        run: |
          set -euo pipefail
          cp docker/entrypoint.sh docker/context/entrypoint.sh
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          source_sha="${SOURCE_SHA256,,}"
          tag="ghcr.io/${owner}/ocserv-vps:${VERSION}"
          docker buildx build \
            --file docker/Dockerfile \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg "OCSERV_VERSION=${VERSION}" \
            --build-arg "SOURCE_SHA256=${source_sha}" \
            --tag "${tag}" \
            --provenance=mode=max \
            --sbom=true \
            --push \
            docker/context
          printf 'image=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"

      - name: Publish result summary
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          {
            echo '## Published ocserv image'
            echo
            echo 'Use this version tag for VPS deployment:'
            echo
            echo '```text'
            echo "${IMAGE}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
