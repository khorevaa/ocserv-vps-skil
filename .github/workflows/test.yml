name: Test

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - codex/**

permissions:
  contents: read

jobs:
  shell-and-ui:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do bash -n "${file}"; done \
            < <(find skills ui docker -type f -name '*.sh' -print0)

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            ui/web/go.mod
            ui/control/go.mod

      - name: Test Go web API
        working-directory: ui/web
        run: go test ./...

      - name: Test Go control adapter
        working-directory: ui/control
        run: go test ./...

      - name: Set up Python for installer contract tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Test installer contracts
        run: python -m unittest discover -s ui/control/tests -p 'test_install_contract.py' -v

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Check frontend JavaScript
        run: |
          node --check ui/web/app/static/access.js
          node --check ui/web/app/static/app.js
