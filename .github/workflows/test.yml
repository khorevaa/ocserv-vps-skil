name: Test

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - codex/**

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do bash -n "${file}"; done \
            < <(find skills -type f -name '*.sh' -print0)

      - name: Verify repository split contract
        run: |
          set -euo pipefail
          [[ ! -e docker ]]
          [[ ! -e ui ]]
          grep -Fq 'https://github.com/khorevaa/ocserv-vps' README.md
          grep -Fq "https://github.com/khorevaa/ocserv-vps'" skills/ocserv-vps/scripts/remote/install-ui.sh
          grep -Fq "https://github.com/khorevaa/ocserv-vps'" skills/ocserv-vps/scripts/remote/upgrade-ui.sh
