name: Publish ocserv UI images

on:
  workflow_dispatch:
    inputs:
      ui_version:
        description: Exact UI version
        required: true
        type: string
      go_build_image:
        description: Exact Go 1.26.5 Alpine builder digest reference
        required: true
        default: golang:1.26.5-alpine@sha256:0178a641fbb4858c5f1b48e34bdaabe0350a330a1b1149aabd498d0699ff5fb2
        type: string
      ocserv_image:
        description: Exact ghcr.io ocserv image version tag used by the control image
        required: true
        default: ghcr.io/khorevaa/ocserv-vps:1.5.0
        type: string

permissions:
  contents: read

concurrency:
  group: publish-ocserv-ui-${{ inputs.ui_version }}
  cancel-in-progress: false

jobs:
  validate-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate release inputs
        env:
          VERSION: ${{ inputs.ui_version }}
          GO_BUILD_IMAGE: ${{ inputs.go_build_image }}
          OCSERV_IMAGE: ${{ inputs.ocserv_image }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]]
          [[ "${GITHUB_REPOSITORY_OWNER,,}" == 'khorevaa' ]]
          [[ "${VERSION}" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$ ]]
          [[ "${GO_BUILD_IMAGE}" == 'golang:1.26.5-alpine@sha256:0178a641fbb4858c5f1b48e34bdaabe0350a330a1b1149aabd498d0699ff5fb2' ]]
          [[ "${OCSERV_IMAGE}" == 'ghcr.io/khorevaa/ocserv-vps:1.5.0' ]]

      - name: Check shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do bash -n "${file}"; done \
            < <(find skills ui docker -type f -name '*.sh' -print0)

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            ui/web/go.mod
            ui/control/go.mod

      - name: Run Go web tests
        working-directory: ui/web
        run: go test ./...

      - name: Run Go control tests
        working-directory: ui/control
        run: go test ./...

      - name: Set up Python for installer contract tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Run installer contract tests
        run: python -m unittest discover -s ui/control/tests -p 'test_install_contract.py' -v

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Check frontend JavaScript
        run: |
          node --check ui/web/app/static/access.js
          node --check ui/web/app/static/app.js

  build-and-push:
    needs: validate-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate image inputs again at the mutation boundary
        env:
          VERSION: ${{ inputs.ui_version }}
          GO_BUILD_IMAGE: ${{ inputs.go_build_image }}
          OCSERV_IMAGE: ${{ inputs.ocserv_image }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]]
          [[ "${VERSION}" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$ ]]
          [[ "${GO_BUILD_IMAGE}" == 'golang:1.26.5-alpine@sha256:0178a641fbb4858c5f1b48e34bdaabe0350a330a1b1149aabd498d0699ff5fb2' ]]
          [[ "${OCSERV_IMAGE}" == 'ghcr.io/khorevaa/ocserv-vps:1.5.0' ]]

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Validate any existing version tags
        env:
          VERSION: ${{ inputs.ui_version }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_exists() {
            local output
            if output="$(docker buildx imagetools inspect "$1" 2>&1)"; then
              return 0
            fi
            if grep -Eqi 'manifest unknown|not found|does not exist' <<<"${output}"; then
              return 1
            fi
            printf '%s\n' "${output}" >&2
            return 2
          }
          for image in \
            "ghcr.io/${owner}/ocserv-vps-ui:${VERSION}" \
            "ghcr.io/${owner}/ocserv-vps-control:${VERSION}"; do
            if image_exists "${image}"; then
              docker pull "${image}"
              revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}")"
              if [[ "${revision}" != "${GITHUB_SHA}" ]]; then
                echo "Refusing to overwrite ${image}; it belongs to revision ${revision}." >&2
                exit 1
              fi
            else
              status=$?
              (( status == 1 )) || exit "${status}"
            fi
          done

      - name: Push commit staging images, then promote the pair
        id: build
        env:
          VERSION: ${{ inputs.ui_version }}
          GO_BUILD_IMAGE: ${{ inputs.go_build_image }}
          OCSERV_IMAGE: ${{ inputs.ocserv_image }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ui_image="ghcr.io/${owner}/ocserv-vps-ui:${VERSION}"
          control_image="ghcr.io/${owner}/ocserv-vps-control:${VERSION}"
          ui_staging="ghcr.io/${owner}/ocserv-vps-ui:revision-${VERSION}-${GITHUB_SHA}"
          control_staging="ghcr.io/${owner}/ocserv-vps-control:revision-${VERSION}-${GITHUB_SHA}"
          image_exists() {
            local output
            if output="$(docker buildx imagetools inspect "$1" 2>&1)"; then
              return 0
            fi
            if grep -Eqi 'manifest unknown|not found|does not exist' <<<"${output}"; then
              return 1
            fi
            printf '%s\n' "${output}" >&2
            return 2
          }
          if image_exists "${ui_staging}"; then
            docker pull "${ui_staging}"
            [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${ui_staging}")" == "${GITHUB_SHA}" ]]
          else
            status=$?
            (( status == 1 )) || exit "${status}"
            docker buildx build \
              --file ui/web/Dockerfile \
              --build-arg "BUILD_IMAGE=${GO_BUILD_IMAGE}" \
              --build-arg "UI_VERSION=${VERSION}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --tag "${ui_staging}" \
              --provenance=mode=max \
              --sbom=true \
              --push \
              ui/web
          fi
          if image_exists "${control_staging}"; then
            docker pull "${control_staging}"
            [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${control_staging}")" == "${GITHUB_SHA}" ]]
          else
            status=$?
            (( status == 1 )) || exit "${status}"
            docker buildx build \
              --file ui/control/Dockerfile \
              --build-arg "BUILD_IMAGE=${GO_BUILD_IMAGE}" \
              --build-arg "OCSERV_IMAGE=${OCSERV_IMAGE}" \
              --build-arg "UI_VERSION=${VERSION}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --tag "${control_staging}" \
              --provenance=mode=max \
              --sbom=true \
              --push \
              ui/control
          fi

          validate_staging() {
            local image="$1" component="$2" revision source image_version
            docker pull "${image}"
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}")"
            source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "${image}")"
            image_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${image}")"
            [[ "${revision}" == "${GITHUB_SHA}" ]]
            [[ "${source}" == 'https://github.com/khorevaa/ocserv-vps-skil' ]]
            [[ "${image_version}" == "${VERSION}" ]]
            [[ "$(docker image inspect --format '{{ index .Config.Labels "org.ocserv-vps.component" }}' "${image}")" == "${component}" ]]
          }
          validate_staging "${ui_staging}" ui
          validate_staging "${control_staging}" control
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.base.name" }}' "${ui_staging}")" == "${GO_BUILD_IMAGE}" ]]
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.base.name" }}' "${control_staging}")" == 'scratch' ]]
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.ocserv-vps.build-image" }}' "${control_staging}")" == "${GO_BUILD_IMAGE}" ]]
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.ocserv-vps.ocserv-image" }}' "${control_staging}")" == "${OCSERV_IMAGE}" ]]
          docker run --rm "${control_staging}" --help

          promote_image() {
            local staging="$1" versioned="$2" staging_id versioned_id status
            docker pull "${staging}"
            staging_id="$(docker image inspect --format '{{.Id}}' "${staging}")"
            if image_exists "${versioned}"; then
              docker pull "${versioned}"
              versioned_id="$(docker image inspect --format '{{.Id}}' "${versioned}")"
              [[ "${versioned_id}" == "${staging_id}" ]] || {
                echo "Refusing to replace existing version tag with a different image: ${versioned}" >&2
                return 1
              }
            else
              status=$?
              (( status == 1 )) || return "${status}"
              docker buildx imagetools create --tag "${versioned}" "${staging}"
            fi
          }
          promote_image "${ui_staging}" "${ui_image}"
          promote_image "${control_staging}" "${control_image}"
          docker pull "${ui_image}"
          docker pull "${control_image}"
          ui_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${ui_image}")"
          control_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${control_image}")"
          ui_component="$(docker image inspect --format '{{ index .Config.Labels "org.ocserv-vps.component" }}' "${ui_image}")"
          control_component="$(docker image inspect --format '{{ index .Config.Labels "org.ocserv-vps.component" }}' "${control_image}")"
          control_ocserv="$(docker image inspect --format '{{ index .Config.Labels "org.ocserv-vps.ocserv-image" }}' "${control_image}")"
          [[ "${ui_revision}" == "${GITHUB_SHA}" ]]
          [[ "${control_revision}" == "${GITHUB_SHA}" ]]
          [[ "${ui_component}" == 'ui' ]]
          [[ "${control_component}" == 'control' ]]
          [[ "${control_ocserv}" == "${OCSERV_IMAGE}" ]]
          printf 'ui_image=%s\n' "${ui_image}" >> "${GITHUB_OUTPUT}"
          printf 'control_image=%s\n' "${control_image}" >> "${GITHUB_OUTPUT}"

      - name: Publish result summary
        env:
          UI_IMAGE: ${{ steps.build.outputs.ui_image }}
          CONTROL_IMAGE: ${{ steps.build.outputs.control_image }}
        run: |
          {
            echo '## Published ocserv UI images'
            echo
            echo '```text'
            echo "${UI_IMAGE}"
            echo "${CONTROL_IMAGE}"
            echo '```'
            echo
            echo '> First publication may create private GHCR packages. Make both packages public before anonymous VPS installation, or pre-authenticate Docker separately.'
          } >> "${GITHUB_STEP_SUMMARY}"
